name: Beta (Release Candidate)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build RC from'
        required: true
        default: 'dev'
        type: string

concurrency:
  group: beta-${{ github.run_id }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: [lint, test]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: true
          fetch-depth: 0

      - name: Set up Python environment
        uses: ./.github/actions/setup-liberation-python

      - name: Set up JS environment
        uses: ./.github/actions/setup-liberation-js

      - name: Get version and compute RC number
        id: version
        shell: pwsh
        run: |
          $content = Get-Content game/version.py -Raw
          $major = [regex]::Match($content, 'MAJOR_VERSION\s*=\s*(\d+)').Groups[1].Value
          $minor = [regex]::Match($content, 'MINOR_VERSION\s*=\s*(\d+)').Groups[1].Value
          $micro = [regex]::Match($content, 'MICRO_VERSION\s*=\s*(\d+)').Groups[1].Value
          $base = "${major}.${minor}.${micro}"

          $existing = git tag -l "v${base}-rc*" | ForEach-Object {
            if ($_ -match 'rc(\d+)$') { [int]$Matches[1] } else { 0 }
          } | Sort-Object -Descending | Select-Object -First 1

          if ($null -eq $existing) { $next = 1 } else { $next = $existing + 1 }

          $tag = "v${base}-rc${next}"
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set build number
        shell: bash
        run: |
          echo $(git rev-list --count HEAD) > resources/buildnumber
          echo ${GITHUB_SHA:0:7} > resources/gitsha

      - name: Build app
        uses: ./.github/actions/build-app

      - name: Create archive
        run: |
          Compress-Archive -Path .\dist\dcs-retribution\ -DestinationPath "dist\dcs-retribution.${{ steps.version.outputs.tag }}.zip"

      - name: Extract release notes
        shell: pwsh
        run: |
          $changelog = Get-Content .\changelog.md
          $headers = $changelog | Select-String -Pattern "^#\s"
          if ($headers.Count -lt 2) {
            "No changelog entries found." | Out-File .\releasenotes.md
          } else {
            $last_change = $headers[1].LineNumber - 2
            ($changelog | Select-Object -First $last_change) -join "`n" | Out-File .\releasenotes.md
          }
          if ((Get-Item .\releasenotes.md).Length -eq 0) {
            "Release candidate build from ${{ inputs.branch }}" | Out-File .\releasenotes.md
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ steps.version.outputs.tag }}"
          body_path: releasenotes.md
          prerelease: true
          files: dist/dcs-retribution.${{ steps.version.outputs.tag }}.zip

      - name: Send status to Discord
        uses: stegzilla/discord-notify@v2
        with:
          webhook_url: ${{ secrets.discord_webhook_betas }}
          title: "Release Candidate ${{ steps.version.outputs.tag }} available!"
          message: "**Branch:** ${{ inputs.branch }}\n**Download:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          include_image: true
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
          username: GitHub Build Notifier
        if: github.repository == 'dcs-retribution/dcs-retribution'