name: Alpha

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: alpha-${{ github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: [lint, test]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python environment
        uses: ./.github/actions/setup-liberation-python

      - name: Set up JS environment
        uses: ./.github/actions/setup-liberation-js

      - name: Get version from source
        id: version
        shell: bash
        run: |
          major=$(grep -oP 'MAJOR_VERSION\s*=\s*\K\d+' game/version.py)
          minor=$(grep -oP 'MINOR_VERSION\s*=\s*\K\d+' game/version.py)
          micro=$(grep -oP 'MICRO_VERSION\s*=\s*\K\d+' game/version.py)
          count=$(git rev-list --count HEAD)
          tag="v${major}.${minor}.${micro}-alpha.${count}"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set build number
        if: steps.check_tag.outputs.exists == 'false'
        shell: bash
        run: |
          echo $(git rev-list --count HEAD) > resources/buildnumber
          echo ${GITHUB_SHA:0:7} > resources/gitsha

      - name: Build app
        if: steps.check_tag.outputs.exists == 'false'
        uses: ./.github/actions/build-app

      - name: Create archive
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          Compress-Archive -Path .\dist\dcs-retribution\ -DestinationPath "dist\dcs-retribution.${{ steps.version.outputs.tag }}.zip"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            **Alpha build** from `dev` branch.

            Commit: ${{ github.sha }}

            ⚠️ This is an unstable development build. Use at your own risk.
          prerelease: true
          files: dist/dcs-retribution.${{ steps.version.outputs.tag }}.zip

      - name: Send status to Discord
        if: steps.check_tag.outputs.exists == 'false' && github.repository == 'dcs-retribution/dcs-retribution'
        uses: stegzilla/discord-notify@v2
        with:
          webhook_url: ${{ secrets.discord_webhook_alphas }}
          title: "Alpha ${{ steps.version.outputs.tag }} available!"
          message: "**Download:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          include_image: true
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
          username: GitHub Build Notifier

  cleanup:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cleanup alpha releases older than 7 days
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -d '7 days ago' -u +%Y-%m-%dT%H:%M:%SZ)
          gh release list --limit 100 --json tagName,createdAt,isPrerelease \
            | jq -r ".[] | select(.isPrerelease and (.tagName | contains(\"alpha\")) and (.createdAt < \"$cutoff\")) | .tagName" \
            | while read -r tag; do
                echo "Deleting old alpha release: $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done